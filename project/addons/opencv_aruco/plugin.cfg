[plugin]

name="OpenCV ArUco Marker Tracking"
description="ArUco marker tracking through the standard Godot XR route (XRServer + OpenXRMarkerTracker + XRAnchor3D), backed by OpenCV and the CameraServer instead of the OpenXR runtime. Includes the Android export guard that fails exports when the libopencv_aruco GDExtension .so files for the enabled ABIs are missing, instead of silently shipping a broken APK."
author="Dennis"
version="2.0"
script="plugin.gd"
